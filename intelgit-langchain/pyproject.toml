[project]
name = "intelgit-langchain"
version = "0.1.0"
description = "LangChain integration for IntelGit – transparent KO caching and reuse"
requires-python = ">=3.11"
dependencies = [
    "intelgit>=0.1.0",
    "langchain-core>=0.1.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["intelgit_langchain*"]
