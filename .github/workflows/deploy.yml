name: Deploy Agent OS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: make build
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: agentos-binaries
          path: bin/
