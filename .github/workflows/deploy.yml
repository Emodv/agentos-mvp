name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Docker build
        run: docker build -t l2agent .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: l2agent
          path: bin/
