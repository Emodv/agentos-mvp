[project]
name = "intelgit"
version = "0.1.0"
description = "Verifiable AI reasoning – cache, sign, and share Knowledge Objects"
readme = "README.md"
license = {text = "MIT"}
keywords = ["ai", "llm", "cache", "knowledge", "agents", "verifiable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://intelgit-hub.fly.dev"
Repository = "https://github.com/emodv/l2agent"

requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "base58>=2.1.1",
    "sqlite-utils>=3.30",
    "openai>=1.0.0",
]

[project.optional-dependencies]
ipfs = ["ipfs-http-client>=0.7.0"]
semantic = ["sentence-transformers>=2.2.0"]
dashboard = ["flask>=3.0.0"]

[project.scripts]
ko = "src.__main__:cli"

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
