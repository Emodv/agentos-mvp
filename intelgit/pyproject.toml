[project]
name = "intelgit"
version = "0.1.0"
description = "Git for Intelligence – version-controlled, verifiable knowledge objects"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "base58>=2.1.1",
    "sqlite-utils>=3.30",
    "openai>=1.0.0",
]

[project.optional-dependencies]
ipfs = ["ipfs-http-client>=0.7.0"]
semantic = ["sentence-transformers>=2.2.0"]
dashboard = ["flask>=3.0.0"]

[project.scripts]
ko = "src.__main__:cli"

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
