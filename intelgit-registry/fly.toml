app = "intelgit-hub"
primary_region = "iad"

[build]
dockerfile = "Dockerfile"

[env]
  INTELGIT_DATA = "/data/intelgit"

[mounts]
  source = "intelgit_data"
  destination = "/data/intelgit"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    hard_limit = 200
    soft_limit = 100

  [[services.http_checks]]
    interval = "15s"
    path = "/health"
    timeout = "5s"
